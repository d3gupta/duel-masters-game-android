name: Android release validation

on:
  push:
    branches:
      - feature/expanded-english-card-database
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      DM_RELEASE_KEYSTORE_BASE64: ${{ secrets.DM_RELEASE_KEYSTORE_BASE64 }}
      DM_RELEASE_STORE_PASSWORD: ${{ secrets.DM_RELEASE_STORE_PASSWORD }}
      DM_RELEASE_KEY_ALIAS: ${{ secrets.DM_RELEASE_KEY_ALIAS }}
      DM_RELEASE_KEY_PASSWORD: ${{ secrets.DM_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses

      - name: Install Android API 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore optional release signing key
        shell: bash
        run: |
          if [ -n "${DM_RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duel-masters-release.keystore"
            echo "DM_RELEASE_STORE_FILE=$RUNNER_TEMP/duel-masters-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Require production signing for release tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test -n "${DM_RELEASE_KEYSTORE_BASE64:-}" || { echo "Missing DM_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "${DM_RELEASE_STORE_PASSWORD:-}" || { echo "Missing DM_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "${DM_RELEASE_KEY_ALIAS:-}" || { echo "Missing DM_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "${DM_RELEASE_KEY_PASSWORD:-}" || { echo "Missing DM_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Build debug and optimized release APKs; run JVM tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

      - name: Run on-device catalogue import test and export rules audit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/reports/card-audit
            adb exec-out run-as com.duelmasters.game.debug cat files/card-rules-support-report.csv > app/build/reports/card-audit/card-rules-support-report.csv
            adb exec-out run-as com.duelmasters.game.debug cat files/card-rules-support-summary.txt > app/build/reports/card-audit/card-rules-support-summary.txt
            test -s app/build/reports/card-audit/card-rules-support-report.csv
            test -s app/build/reports/card-audit/card-rules-support-summary.txt

      - name: Verify signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-android-validation-build-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK for physical-device QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-android-debug-qa-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload rules coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-rules-coverage-${{ github.sha }}
          path: app/build/reports/card-audit/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload unit and instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-test-results-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/card-audit/
          if-no-files-found: ignore
          retention-days: 14
