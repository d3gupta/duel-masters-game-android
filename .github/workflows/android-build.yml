name: Android release validation

on:
  push:
    branches:
      - feature/expanded-english-card-database
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      DM_RELEASE_KEYSTORE_BASE64: ${{ secrets.DM_RELEASE_KEYSTORE_BASE64 }}
      DM_RELEASE_STORE_PASSWORD: ${{ secrets.DM_RELEASE_STORE_PASSWORD }}
      DM_RELEASE_KEY_ALIAS: ${{ secrets.DM_RELEASE_KEY_ALIAS }}
      DM_RELEASE_KEY_PASSWORD: ${{ secrets.DM_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses

      - name: Install Android API 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore optional release signing key
        shell: bash
        run: |
          if [ -n "${DM_RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duel-masters-release.keystore"
            echo "DM_RELEASE_STORE_FILE=$RUNNER_TEMP/duel-masters-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug and optimized release APKs; run JVM tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

      - name: Run on-device catalogue import test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-android-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit and instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-test-results-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
