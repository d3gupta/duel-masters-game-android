name: Android release validation

on:
  push:
    branches:
      - feature/expanded-english-card-database
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      DM_RELEASE_KEYSTORE_BASE64: ${{ secrets.DM_RELEASE_KEYSTORE_BASE64 }}
      DM_RELEASE_STORE_PASSWORD: ${{ secrets.DM_RELEASE_STORE_PASSWORD }}
      DM_RELEASE_KEY_ALIAS: ${{ secrets.DM_RELEASE_KEY_ALIAS }}
      DM_RELEASE_KEY_PASSWORD: ${{ secrets.DM_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses

      - name: Install Android API 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM acceleration is available."
          else
            echo "KVM is unavailable on this runner; the emulator will use software acceleration."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore optional release signing key
        shell: bash
        run: |
          if [ -n "${DM_RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duel-masters-release.keystore"
            echo "DM_RELEASE_STORE_FILE=$RUNNER_TEMP/duel-masters-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Require production signing for release tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test -n "${DM_RELEASE_KEYSTORE_BASE64:-}" || { echo "Missing DM_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "${DM_RELEASE_STORE_PASSWORD:-}" || { echo "Missing DM_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "${DM_RELEASE_KEY_ALIAS:-}" || { echo "Missing DM_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "${DM_RELEASE_KEY_PASSWORD:-}" || { echo "Missing DM_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Build debug and optimized release APKs; run JVM tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

      - name: Run on-device catalogue import test and export rules audit
        shell: bash
        run: |
          set -euo pipefail

          AVD_NAME="duel-masters-ci"
          DEVICE="emulator-5554"
          AVD_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f | head -n 1)"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          EMULATOR_LOG="app/build/reports/android-emulator/emulator.log"

          test -x "$AVD_MANAGER"
          test -x "$ADB"
          test -x "$EMULATOR"
          mkdir -p "$ANDROID_HOME/.android" "$HOME/.android/avd" "$(dirname "$EMULATOR_LOG")"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          printf 'no\n' | "$AVD_MANAGER" create avd --force -n "$AVD_NAME" --package 'system-images;android-36;google_apis;x86_64'
          cat >> "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini" <<'EOF'
          hw.cpu.ncore=2
          hw.keyboard=yes
          EOF

          EMULATOR_ARGS=(-no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none)
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "Starting emulator without KVM acceleration."
            EMULATOR_ARGS+=(-accel off)
          else
            echo "Starting emulator with KVM acceleration."
          fi

          "$EMULATOR" -port 5554 -avd "$AVD_NAME" "${EMULATOR_ARGS[@]}" > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!

          cleanup_emulator() {
            local exit_code=$?
            if [[ "$exit_code" -ne 0 ]]; then
              echo "--- Android emulator log (last 160 lines) ---"
              tail -n 160 "$EMULATOR_LOG" || true
            fi
            "$ADB" -s "$DEVICE" emu kill >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" 2>/dev/null || true
            return "$exit_code"
          }
          trap cleanup_emulator EXIT

          echo "Waiting for Android system boot..."
          booted=false
          for attempt in $(seq 1 600); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator process exited before boot completed."
              exit 1
            fi
            boot_state=$("$ADB" -s "$DEVICE" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [[ "$boot_state" == "1" ]]; then
              booted=true
              break
            fi
            sleep 1
          done
          if [[ "$booted" != true ]]; then
            echo "Timed out waiting for Android system boot."
            exit 1
          fi

          echo "Android system boot completed; waiting for framework services..."
          input_ready=false
          for attempt in $(seq 1 180); do
            input_service=$("$ADB" -s "$DEVICE" shell service check input 2>/dev/null | tr -d '\r' || true)
            if [[ "$input_service" == *"Service input: found"* ]]; then
              input_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$input_ready" != true ]]; then
            echo "Timed out waiting for Android InputManager service."
            "$ADB" -s "$DEVICE" shell service check input || true
            exit 1
          fi

          settings_ready=false
          for attempt in $(seq 1 60); do
            animation_scale=$("$ADB" -s "$DEVICE" shell settings get global window_animation_scale 2>/dev/null | tr -d '\r' || true)
            if [[ "$animation_scale" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              settings_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$settings_ready" != true ]]; then
            echo "Timed out waiting for Android settings provider."
            exit 1
          fi

          echo "Android input and settings services are ready."
          "$ADB" -s "$DEVICE" shell input keyevent 82
          "$ADB" -s "$DEVICE" shell settings put global window_animation_scale 0.0
          "$ADB" -s "$DEVICE" shell settings put global transition_animation_scale 0.0
          "$ADB" -s "$DEVICE" shell settings put global animator_duration_scale 0.0

          export ANDROID_SERIAL="$DEVICE"
          gradle --no-daemon :app:connectedDebugAndroidTest

          mkdir -p app/build/reports/card-audit
          "$ADB" exec-out run-as com.duelmasters.game.debug cat files/card-rules-support-report.csv > app/build/reports/card-audit/card-rules-support-report.csv
          "$ADB" exec-out run-as com.duelmasters.game.debug cat files/card-rules-support-full-report.csv > app/build/reports/card-audit/card-rules-support-full-report.csv
          "$ADB" exec-out run-as com.duelmasters.game.debug cat files/card-rules-support-summary.txt > app/build/reports/card-audit/card-rules-support-summary.txt
          test -s app/build/reports/card-audit/card-rules-support-report.csv
          test -s app/build/reports/card-audit/card-rules-support-full-report.csv
          test -s app/build/reports/card-audit/card-rules-support-summary.txt

      - name: Verify signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-android-validation-build-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK for physical-device QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-android-debug-qa-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload rules coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-rules-coverage-${{ github.sha }}
          path: app/build/reports/card-audit/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload unit and instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-masters-test-results-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/card-audit/
            app/build/reports/android-emulator/
          if-no-files-found: ignore
          retention-days: 14
